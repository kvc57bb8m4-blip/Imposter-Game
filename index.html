<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>IMPOSTER</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  min-height:100%;
  background:#090b12;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:24px 16px 40px
}

h1{
  text-align:center;
  font-size:46px;
  margin:18px 0 28px;
  letter-spacing:3px;
  font-weight:900
}

.card{
  background:#131724;
  border:1px solid #292f43;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.2)
}

h2{margin-top:0}

input,button{
  width:100%;
  height:54px;
  border-radius:14px;
  font-size:17px;
  margin-top:10px
}

input{
  padding:0 15px;
  background:#090c14;
  border:1px solid #353c51;
  color:#fff;
  outline:none
}

input:focus{border-color:#686aff}

button{
  border:0;
  background:#6264ff;
  color:#fff;
  font-weight:800
}

button:active{transform:scale(.98)}

button:disabled{opacity:.5}

.secondary{background:#242a3b}

.status{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:#1c2130;
  font-size:14px;
  line-height:1.4;
  word-break:break-word
}

.ok{color:#7ee5a7}
.err{color:#ff8199}

.hidden{display:none!important}

.code{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:7px;
  margin:12px 0
}

.player{
  background:#0d111b;
  border:1px solid #252b3c;
  padding:13px;
  border-radius:12px;
  margin-top:8px
}

.host{
  color:#8c8fff;
  font-size:13px;
  font-weight:700;
  float:right
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:10px
}

.tab{
  flex:1;
  margin:0;
  background:#242a3b
}

.tab.active{
  background:#6264ff
}

.center{
  text-align:center
}

.small{
  color:#9299ac;
  font-size:13px;
  text-align:center;
  margin-top:14px
}

.divider{
  height:1px;
  background:#292f43;
  margin:20px 0
}
</style>
</head>

<body>

<main class="app">

<h1>IMPOSTER</h1>

<!-- HOME -->
<section id="home">

  <div class="tabs">
    <button id="createTab" class="tab active">Create Game</button>
    <button id="joinTab" class="tab">Join Game</button>
  </div>

  <!-- CREATE -->
  <div id="createCard" class="card">

    <h2>Create Room</h2>

    <input
      id="createName"
      maxlength="24"
      autocomplete="name"
      placeholder="Your name"
    >

    <button id="createButton">
      Create Room
    </button>

    <div id="createStatus" class="status">
      Checking multiplayer connection...
    </div>

  </div>

  <!-- JOIN -->
  <div id="joinCard" class="card hidden">

    <h2>Join Room</h2>

    <input
      id="joinName"
      maxlength="24"
      autocomplete="name"
      placeholder="Your name"
    >

    <input
      id="joinCode"
      maxlength="6"
      autocapitalize="characters"
      autocomplete="off"
      placeholder="6-character room code"
    >

    <button id="joinButton">
      Join Game
    </button>

    <div id="joinStatus" class="status">
      Enter the code your friend gave you.
    </div>

  </div>

</section>


<!-- ROOM -->
<section id="room" class="card hidden">

  <h2 class="center">Game Lobby</h2>

  <div id="roomCode" class="code">------</div>

  <p class="center">
    Share this code with your friends.
  </p>

  <div class="divider"></div>

  <div id="players">
    Loading players...
  </div>

  <button id="startButton">
    Start Game
  </button>

  <button id="leaveButton" class="secondary">
    Leave Room
  </button>

  <div id="roomStatus" class="status">
    Waiting for players...
  </div>

</section>

<p class="small">
  Multiplayer powered by Supabase
</p>

</main>


<script>
"use strict";

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://rcpxsidynmfstsihqyfc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OT5vlPKSNyzftGwrNesWAA_j2i2L88V";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   STATE
============================== */

let game = null;
let player = null;
let channel = null;


/* ==============================
   ELEMENTS
============================== */

const home =
  document.getElementById("home");

const createCard =
  document.getElementById("createCard");

const joinCard =
  document.getElementById("joinCard");

const createTab =
  document.getElementById("createTab");

const joinTab =
  document.getElementById("joinTab");

const createName =
  document.getElementById("createName");

const joinName =
  document.getElementById("joinName");

const joinCode =
  document.getElementById("joinCode");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");

const createStatus =
  document.getElementById("createStatus");

const joinStatus =
  document.getElementById("joinStatus");

const room =
  document.getElementById("room");

const roomCode =
  document.getElementById("roomCode");

const players =
  document.getElementById("players");

const startButton =
  document.getElementById("startButton");

const leaveButton =
  document.getElementById("leaveButton");

const roomStatus =
  document.getElementById("roomStatus");


/* ==============================
   TOKEN
============================== */

function getToken(){

  let token =
    localStorage.getItem(
      "imposter_player_token"
    );

  if(!token){

    token =
      crypto.randomUUID();

    localStorage.setItem(
      "imposter_player_token",
      token
    );
  }

  return token;
}


/* ==============================
   STATUS
============================== */

function status(element,text,type=""){
  element.textContent = text;
  element.className =
    "status " + type;
}


/* ==============================
   TABS
============================== */

createTab.onclick = function(){

  createTab.classList.add("active");
  joinTab.classList.remove("active");

  createCard.classList.remove("hidden");
  joinCard.classList.add("hidden");

};


joinTab.onclick = function(){

  joinTab.classList.add("active");
  createTab.classList.remove("active");

  joinCard.classList.remove("hidden");
  createCard.classList.add("hidden");

};


/* ==============================
   CHECK CONNECTION
============================== */

async function checkConnection(){

  try{

    const result =
      await db
        .from("game_categories")
        .select("id")
        .limit(1);

    if(result.error)
      throw result.error;

    status(
      createStatus,
      "✓ Multiplayer server connected",
      "ok"
    );

  }catch(error){

    console.error(error);

    status(
      createStatus,
      "Connection error: " +
      error.message,
      "err"
    );

  }

}


/* ==============================
   CREATE GAME
============================== */

async function createGame(){

  const name =
    createName.value.trim();

  if(!name){

    status(
      createStatus,
      "Enter your name.",
      "err"
    );

    createName.focus();

    return;
  }

  createButton.disabled = true;

  status(
    createStatus,
    "Creating room..."
  );

  try{

    const token =
      getToken();

    const result =
      await db.rpc(
        "create_game",
        {
          p_host_token:token,
          p_name:name,
          p_max_players:12
        }
      );

    console.log(
      "CREATE RESULT",
      result
    );

    if(result.error)
      throw result.error;

    if(!result.data)
      throw new Error(
        "No room was returned."
      );

    game =
      result.data.game;

    player =
      result.data.player;

    if(!game || !game.id || !game.code){

      throw new Error(
        "Invalid room returned."
      );

    }

    openRoom();

  }catch(error){

    console.error(
      "CREATE ERROR",
      error
    );

    status(
      createStatus,
      "Could not create room: " +
      error.message,
      "err"
    );

  }finally{

    createButton.disabled = false;

  }

}


/* ==============================
   JOIN GAME
============================== */

async function joinGame(){

  const name =
    joinName.value.trim();

  const code =
    joinCode.value.trim().toUpperCase();

  if(!name){

    status(
      joinStatus,
      "Enter your name.",
      "err"
    );

    joinName.focus();

    return;
  }

  if(!/^[A-Z0-9]{6}$/.test(code)){

    status(
      joinStatus,
      "Enter the 6-character room code.",
      "err"
    );

    joinCode.focus();

    return;
  }

  joinButton.disabled = true;

  status(
    joinStatus,
    "Joining room..."
  );

  try{

    const token =
      getToken();

    const result =
      await db.rpc(
        "join_game",
        {
          p_code:code,
          p_player_token:token,
          p_name:name
        }
      );

    console.log(
      "JOIN RESULT",
      result
    );

    if(result.error)
      throw result.error;

    if(!result.data)
      throw new Error(
        "No room was returned."
      );

    game =
      result.data.game;

    player =
      result.data.player;

    if(!game || !game.id){

      throw new Error(
        "Invalid room returned."
      );

    }

    openRoom();

  }catch(error){

    console.error(
      "JOIN ERROR",
      error
    );

    status(
      joinStatus,
      "Could not join room: " +
      error.message,
      "err"
    );

  }finally{

    joinButton.disabled = false;

  }

}


/* ==============================
   OPEN ROOM
============================== */

function openRoom(){

  home.classList.add("hidden");
  room.classList.remove("hidden");

  roomCode.textContent =
    game.code;

  startButton.style.display =
    player && player.is_host
      ? "block"
      : "none";

  roomStatus.textContent =
    "Waiting for players...";

  loadPlayers();

  subscribe();

}


/* ==============================
   LOAD PLAYERS
============================== */

async function loadPlayers(){

  if(!game)
    return;

  const result =
    await db
      .from("game_players")
      .select(
        "id,display_name,is_host,is_alive"
      )
      .eq(
        "game_id",
        game.id
      )
      .order(
        "joined_at",
        {ascending:true}
      );

  if(result.error){

    players.innerHTML =
      "<p>Could not load players.</p>";

    console.error(result.error);

    return;
  }

  const list =
    result.data || [];

  players.innerHTML =
    "<h3>Players (" +
    list.length +
    ")</h3>";

  list.forEach(p=>{

    const div =
      document.createElement("div");

    div.className =
      "player";

    const span =
      document.createElement("span");

    span.textContent =
      p.display_name;

    div.appendChild(span);

    if(p.is_host){

      const host =
        document.createElement("span");

      host.className =
        "host";

      host.textContent =
        "HOST";

      div.appendChild(host);

    }

    players.appendChild(div);

  });

  if(list.length < 3){

    roomStatus.textContent =
      "Waiting for at least 3 players...";

  }else{

    roomStatus.textContent =
      list.length +
      " players in the room.";

  }

}


/* ==============================
   REALTIME
============================== */

function subscribe(){

  if(!game)
    return;

  if(channel){

    db.removeChannel(channel);

  }

  channel =
    db
      .channel(
        "room-" + game.id
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"game_players",
          filter:
            "game_id=eq." +
            game.id
        },
        function(){

          loadPlayers();

        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"games",
          filter:
            "id=eq." +
            game.id
        },
        function(payload){

          console.log(
            "GAME UPDATE",
            payload
          );

          if(
            payload.new &&
            payload.new.status &&
            payload.new.status !== "lobby"
          ){

            roomStatus.textContent =
              "Game status: " +
              payload.new.status;

          }

        }
      )

      .subscribe(
        function(s){

          console.log(
            "Realtime:",
            s
          );

        }
      );

}


/* ==============================
   START GAME
============================== */

async function startGame(){

  if(!game || !player)
    return;

  if(!player.is_host)
    return;

  startButton.disabled = true;

  roomStatus.textContent =
    "Starting game...";

  try{

    const result =
      await db.rpc(
        "start_game",
        {
          p_code:game.code,
          p_host_token:getToken()
        }
      );

    console.log(
      "START RESULT",
      result
    );

    if(result.error)
      throw result.error;

    roomStatus.textContent =
      "Game started!";

  }catch(error){

    console.error(
      "START ERROR",
      error
    );

    roomStatus.textContent =
      "Could not start game: " +
      error.message;

  }finally{

    startButton.disabled = false;

  }

}


/* ==============================
   LEAVE
============================== */

async function leaveGame(){

  if(channel){

    await db.removeChannel(
      channel
    );

    channel = null;

  }

  game = null;
  player = null;

  room.classList.add(
    "hidden"
  );

  home.classList.remove(
    "hidden"
  );

  status(
    createStatus,
    "Ready to create a game.",
    "ok"
  );

}


/* ==============================
   EVENTS
============================== */

createButton.onclick =
  createGame;

joinButton.onclick =
  joinGame;

startButton.onclick =
  startGame;

leaveButton.onclick =
  leaveGame;


createName.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter")
      createGame();

  }
);


joinName.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter")
      joinGame();

  }
);


joinCode.addEventListener(
  "input",
  function(){

    joinCode.value =
      joinCode.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"")
        .slice(0,6);

  }
);


/* ==============================
   START
============================== */

checkConnection();

</script>

</body>
</html>
