<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>IMPOSTER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090b12;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:620px;margin:auto;padding:24px 16px}h1{text-align:center;font-size:44px} .card{background:#131724;border:1px solid #292f43;border-radius:20px;padding:20px;margin:14px 0}input,button{width:100%;height:54px;box-sizing:border-box;border-radius:13px;margin:6px 0;font-size:17px}input{padding:0 14px;background:#090c14;border:1px solid #353c51;color:white}button{border:0;background:#6264ff;color:white;font-weight:700}button:disabled{opacity:.5}.status{padding:12px;border-radius:12px;background:#1c2130;margin-top:12px;word-break:break-word}.ok{color:#7ee5a7}.err{color:#ff8199}.code{text-align:center;font-size:42px;font-weight:900;letter-spacing:7px}</style></head><body><main class="app"><h1>IMPOSTER</h1><div class="card"><h2>Create Room</h2><input id="name" autocomplete="name" placeholder="Your name"><button id="create">Create Room</button><div id="status" class="status">Connecting to multiplayer server...</div></div><div id="room" class="card" style="display:none"><div class="code" id="code"></div><p style="text-align:center">Share this code with your friends.</p><div id="players"></div><button id="start">Start Game</button></div></main><script>const URL='https://rcpxsidynmfstsihqyfc.supabase.co',KEY='sb_publishable_OT5vlPKSNyzftGwrNesWAA_j2i2L88V',s=supabase.createClient(URL,KEY);let game,player;const status=document.getElementById('status');function tok(){let x=localStorage.getItem('imp_token');if(!x){x=crypto.randomUUID();localStorage.setItem('imp_token',x)}return x}async function check(){try{let r=await s.from('game_categories').select('id').limit(1);if(r.error)throw r.error;status.textContent='âœ“ Multiplayer server connected';status.className='status ok'}catch(e){status.textContent='Connection error: '+e.message;status.className='status err'}}async function create(){let n=document.getElementById('name').value.trim();if(!n){status.textContent='Enter your name.';status.className='status err';return}document.getElementById('create').disabled=true;status.textContent='Creating room...';try{let r=await s.rpc('create_game',{p_host_token:tok(),p_name:n,p_max_players:12});if(r.error)throw r.error;if(!r.data?.game)throw Error('No room returned');game=r.data.game;player=r.data.player;document.getElementById('code').textContent=game.code;document.getElementById('room').style.display='block';status.textContent='âœ“ Room created';status.className='status ok';watch()}catch(e){status.textContent='CREATE ERROR: '+e.message;status.className='status err';console.error(e)}finally{document.getElementById('create').disabled=false}}async function watch(){async function load(){let r=await s.from('game_players').select('display_name,is_host').eq('game_id',game.id);if(!r.error)document.getElementById('players').innerHTML='<h3>Players ('+r.data.length+')</h3>'+r.data.map(p=>'<p>'+p.display_name+(p.is_host?' â€” HOST':'')+'</p>').join('')}load();s.channel('room-'+game.id).on('postgres_changes',{event:'*',schema:'public',table:'game_players',filter:'game_id=eq.'+game.id},load).subscribe()}document.getElementById('create').onclick=create;check();</script></body></html>
