/* =========================================================
   PLAYER TOKEN
========================================================= */

function getToken(){

  let token =
    localStorage.getItem(
      "imposter_player_token"
    );

  if(!token){

    if(
      window.crypto &&
      typeof crypto.randomUUID === "function"
    ){

      token = crypto.randomUUID();

    }else{

      token =
        "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(
          /[xy]/g,
          function(c){

            const r =
              Math.random()*16|0;

            const v =
              c==="x"
              ? r
              : (r&3)|8;

            return v.toString(16);

          }
        );

    }

    localStorage.setItem(
      "imposter_player_token",
      token
    );

  }

  return token;
}

function saveRoom(){

  if(savedRoster.length){

    localStorage.setItem(
      "imposter_room_roster",
      JSON.stringify(savedRoster)

  }
}


function clearSavedRoom(){

  localStorage.removeItem(
    "imposter_room_code"
  );

  localStorage.removeItem(
    "imposter_room_roster"
  );

  savedRoster = [];
}


function saveRoster(list){

  if(!Array.isArray(list)) return;

  savedRoster =
    list.map(p => ({
      id:p.id,
      display_name:p.display_name
    }));

  try{

    localStorage.setItem(
      "imposter_room_roster",
      JSON.stringify(savedRoster)
    );

  }catch(e){

    console.warn(
      "Could not save roster:",
      e
    );

  }
}


function loadSavedRoster(){

  try{

    const raw =
      localStorage.getItem(
        "imposter_room_roster"
      );

    if(!raw){

      savedRoster = [];
      return;

    }

    const parsed = JSON.parse(raw);

    savedRoster =
      Array.isArray(parsed)
      ? parsed
      : [];

  }catch(e){

    savedRoster = [];

  }
}

/* =========================================================
   CONNECTION
========================================================= */

async function checkConnection(){

  setConnection(
    false,
    "Connecting..."
  );

  setStatus(
    createStatus,
    "Connecting to multiplayer..."
  );

  try{

    if(!db)
      initSupabase();

    const timeout =
      new Promise(
        (_,reject)=>{

          setTimeout(
            () => reject(
              new Error(
                "Connection timed out."
              )
            ),
            8000
          );

        }
      );

    const request =
      db
      .from("game_categories")
      .select("id,name")
      .limit(1);

    const result =
      await Promise.race([
        request,
        timeout
      ]);

    if(result.error)
      throw result.error;

    setConnection(
      true,
      "Multiplayer connected"
    );

    setStatus(
      createStatus,
      "✓ Multiplayer server connected",
      "ok"
    );

    await loadCategories();

  }catch(error){

    console.error(
      "Connection error:",
      error
    );

    setConnection(
      false,
      "Multiplayer connection problem"
    );

    setStatus(
      createStatus,
      "Connection failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "err"
    );

  }
}

/* =========================================================
   REJOIN CHECK
========================================================= */

async function checkForPreviousGame(){

  const savedCode =
    localStorage.getItem(
      "imposter_room_code"
    );

  if(!savedCode)
    return;

  loadSavedRoster();

  try{

    const result =
      await db.rpc(
        "resume_game",
        {
          p_code:savedCode,
          p_player_token:getToken()
        }
      );

    if(result.error)
      throw result.error;

    if(!result.data)
      throw new Error(
        "Previous game unavailable."
      );

    const previousGame =
      result.data.game;

    const previousPlayer =
      result.data.player;

    if(!previousGame || !previousPlayer)
      throw new Error(
        "Previous game unavailable."
      );

    const activeStatuses = [
      "lobby",
      "playing",
      "clues",
      "voting",
      "results"
    ];

    if(
      !activeStatuses.includes(
        previousGame.status
      )
    ){

      throw new Error(
        "Game is no longer active."
      );

    }

    const playersResult =
      await db
      .from("game_players")
      .select(
        "id,display_name,is_host,is_alive"
      )
      .eq(
        "game_id",
        previousGame.id
      );

    if(playersResult.error)
      throw playersResult.error;

    const currentPlayers =
      playersResult.data || [];

    /*
      IMPORTANT:
      There must actually be another
      person in the room.
    */

    if(currentPlayers.length < 2){

      rejoinCard.classList.add(
        "hidden"
      );

      clearSavedRoom();

      return;
    }

    /*
      If we have a saved roster,
      make sure the room still contains
      the same group.
    */

    if(savedRoster.length){

      const currentIds =
        new Set(
          currentPlayers.map(
            p => p.id
          )
        );

      const everyoneStillHere =
        savedRoster.every(
          p => currentIds.has(p.id)
        );

      if(!everyoneStillHere){

        rejoinCard.classList.add(
          "hidden"
        );

        return;
      }

    }

    let phaseText =
      "Game in progress.";

    if(previousGame.status === "lobby")
      phaseText =
        "The lobby is still open.";

    if(previousGame.status === "playing")
      phaseText =
        "The role round is active.";

    if(previousGame.status === "clues")
      phaseText =
        "The clue round is active.";

    if(previousGame.status === "voting")
      phaseText =
        "Voting is active.";

    if(previousGame.status === "results")
      phaseText =
        "The results are being shown.";

    rejoinInfo.innerHTML =
      "Room <strong>" +
      previousGame.code +
      "</strong><br>" +
      phaseText +
      "<br><br>" +
      currentPlayers.length +
      " players are still in the game.";

    rejoinCard.classList.remove(
      "hidden"
    );

  }catch(error){

    console.log(
      "No rejoinable game:",
      error.message
    );

    rejoinCard.classList.add(
      "hidden"
    );

  }
}

/* =========================================================
   LOAD PLAYERS
========================================================= */

async function loadPlayers(){

  if(!game || !db)
    return;

  try{

    const result =
      await db
      .from("game_players")
      .select(
        "id,display_name,is_host,is_alive"
      )
      .eq(
        "game_id",
        game.id
      )
      .order("joined_at");

    if(result.error)
      throw result.error;

    const list =
      result.data || [];

    if(list.length)
      saveRoster(list);

    players.innerHTML =
      "<h3>Players (" +
      list.length +
      ")</h3>";

    list.forEach(p => {

      const div =
        document.createElement("div");

      div.className =
        "player";

      div.textContent =
        p.display_name;

      if(p.id === player?.id)
        div.textContent +=
          " (You)";

      if(p.is_host){

        const h =
          document.createElement("span");

        h.className = "host";
        h.textContent = "HOST";

        div.appendChild(h);

      }

      players.appendChild(div);

    });

    lobbyStatus.textContent =
      list.length +
      " player" +
      (
        list.length === 1
        ? ""
        : "s"
      ) +
      " in the room.";

  }catch(error){

    console.error(
      "Player loading:",
      error
    );

    players.innerHTML =
      "<p>Could not load players. Retrying...</p>";

  }
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToGame(){

  if(!game || !db)
    return;

  if(channel){

    try{
      db.removeChannel(channel);
    }catch(e){}

    channel = null;

  }

  const roomId = game.id;

  channel =
    db
    .channel(
      "imposter-room-" + roomId
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"games",
        filter:"id=eq." + roomId
      },
      async () => {
        await syncGame();
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"game_players",
        filter:"game_id=eq." + roomId
      },
      async () => {

        await loadPlayers();
        await syncGame();

      }
    )

    .subscribe(status => {

      console.log(
        "Realtime status:",
        status
      );

      if(status === "SUBSCRIBED"){

        setConnection(
          true,
          "Multiplayer connected"
        );

      }

      if(
        status === "CHANNEL_ERROR" ||
        status === "TIMED_OUT"
      ){

        setConnection(
          false,
          "Realtime reconnecting..."
        );

        setTimeout(
          () => {
            if(game)
              subscribeToGame();
          },
          1500
        );

      }

    });

}


/* =========================================================
   POLLING SAFETY NET
========================================================= */

function startSyncLoop(){

  clearInterval(
    syncInterval
  );

  syncInterval =
    setInterval(
      async () => {

        if(game)
          await syncGame();

      },
      700
    );

}


/* =========================================================
   GAME SYNC
========================================================= */

async function syncGame(){

  if(
    !game ||
    !db ||
    syncing
  )
    return;

  syncing = true;

  try{

    const result =
      await db
      .from("games")
      .select("*")
      .eq(
        "id",
        game.id
      )
      .maybeSingle();

    if(result.error)
      throw result.error;

    if(!result.data)
      throw new Error(
        "Game no longer exists."
      );

    game =
      result.data;

    saveRoom();

    setConnection(
      true,
      "Multiplayer connected"
    );

    const status =
      game.status;

    if(status !== lastGameStatus){

      lastGameStatus =
        status;

      await handlePhase(status);

    }else{

      /*
        Keep each phase synchronized even
        when the status itself has not changed.
      */

      if(status === "clues"){

        await syncClueState();

      }

      else if(status === "voting"){

        if(
          votingScreen.classList.contains(
            "hidden"
          )
        ){

          await showVoting();

        }

      }

      else if(status === "results"){

        /*
          ALWAYS refresh results.
          This is important because the
          transition can happen on another
          player's device.
        */

        await loadResults();

      }

    }

  }catch(error){

    console.warn(
      "Sync error:",
      error.message
    );

    setConnection(
      false,
      "Reconnecting..."
    );

  }finally{

    syncing = false;

  }

}


/* =========================================================
   PHASE HANDLER
========================================================= */

async function handlePhase(phase){

  if(!game || !player)
    return;

  console.log(
    "AUTHORITATIVE PHASE:",
    phase
  );

  if(phase === "lobby"){

    await loadPlayers();

    openLobby();

  }

  else if(phase === "playing"){

    await loadRole();

  }

  else if(phase === "clues"){

    /*
      Load the role and then immediately
      show the clue screen.

      NO "Synchronizing..." role screen.
    */

    await loadRole();

    await syncClueState();

  }

  else if(phase === "voting"){

    await showVoting();

  }

  else if(phase === "results"){

    await loadResults();

  }

}


/* =========================================================
   ROLE
========================================================= */

async function loadRole(){

  if(!game || !player)
    return;

  try{

    const result =
      await db.rpc(
        "get_role",
        {
          p_code:game.code,
          p_player_token:getToken()
        }
      );

    if(result.error)
      throw result.error;

    const data =
      result.data;

    if(!data)
      throw new Error(
        "No role data returned."
      );

    if(data.status === "lobby"){

      openLobby();
      return;

    }

    currentRound =
      Number(
        data.round || 1
      );

    timeLimit =
      Number(
        data.clue_time || 60
      );

    playerRole =
      data.is_imposter
      ? "imposter"
      : "player";

    playerWord =
      data.word ||
      data.secret_word ||
      "";

    playerHint =
      data.hint ||
      data.imposter_hint ||
      data.hint_word ||
      data.hintWord ||
      "";

    roleCategory.textContent =
      data.category ||
      "CATEGORY";

    /*
      We don't send players to the
      separate role screen anymore.
      Their role appears on the clue screen.
    */

    renderRoleOnClueScreen();

    if(game.status === "clues"){

      show(clueScreen);

    }else{

      show(roleScreen);

    }

  }catch(error){

    console.error(
      "Role error:",
      error
    );

  }

}


/* =========================================================
   ROLE DISPLAY ON CLUE SCREEN
========================================================= */

function renderRoleOnClueScreen(){

  /*
    Remove any old role panel.
  */

  const old =
    document.getElementById(
      "clueRoleInfo"

  if(old)

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   GET CLUE ORDER
========================================================= */

async function getClueOrder(){

  const result =
    await db
    .from("game_players")
    .select(
      "id,display_name,is_alive"
    )
    .eq(
      "game_id",
      game.id
    )
    .eq(
      "is_alive",
      true
    );

  if(result.error)
    throw result.error;

  const map =
    new Map(
      (result.data || [])
      .map(
        p => [p.id,p]
      )
    );

  const serverOrder =
    Array.isArray(game.clue_order)
    ? game.clue_order
    : [];

  let order =
    serverOrder
    .map(
      id => map.get(id)
    )
    .filter(Boolean);

  if(!order.length){

    order =
      (result.data || []).slice();

  }

  return order;
}


/* =========================================================
   CLUE SYNC
========================================================= */

async function syncClueState(){

  if(!game)
    return;

  if(game.status !== "clues")
    return;

  try{

    clueOrder =
      await getClueOrder();

    currentTurn =
      Number(
        game.clue_turn || 0
      );

    currentRound =
      Number(
        game.round_number || 1
      );

    timeLimit =
      Number(
        game.clue_time || 60
      );

    skippedPlayers =
      new Set(
        Array.isArray(
          game.skipped_player_ids
        )
        ? game.skipped_player_ids
        : []
      );

    renderRoleOnClueScreen();

    renderClueList();

    startClueTurn();

    show(clueScreen);

  }catch(error){

    console.error(
      "Clue sync:",
      error
    );

    /*
      NEVER leave the player staring at
      "Synchronizing..." forever.
    */

    clueTurnMessage.textContent =
      "Loading clue order...";

    setTimeout(
      () => {

        if(
          game &&
          game.status === "clues"
        ){

          syncClueState();

        }

      },
      500
    );

  }

}

/* =========================================================
   CLUE TURN
========================================================= */

function startClueTurn(){

  if(game?.status !== "clues")
    return;

  if(!clueOrder.length){

    clueTurnMessage.textContent =
      "Loading clue order...";

    return;
  }

  if(
    currentTurn >= clueOrder.length
  ){

    clueDoneButton.style.display =
      "none";

    clueTurnMessage.textContent =
      "Everyone has given a clue.";

    return;

  }

  const current =
    clueOrder[currentTurn];

  const isMe =
    current &&
    current.id === player.id;

  if(isMe){

    clueTurnMessage.textContent =
      "🔥 IT'S YOUR TURN — GIVE YOUR CLUE!";

    clueDoneButton.style.display =
      "block";

    clueDoneButton.disabled =
      false;

  }else{

    /*
      No "next person" system.
      The order is already shown.
    */

    clueTurnMessage.textContent =
      "Follow the order above.";

    clueDoneButton.style.display =
      "none";

  }

  hostSkipControls.classList.toggle(
    "hidden",
    !player.is_host
  );

  startAuthoritativeTimer();

}


/* =========================================================
   TIMER
========================================================= */

function startAuthoritativeTimer(){

  clearInterval(
    clueInterval
  );

  if(timeLimit === 0){

    clueTimer.className =
      "noTimer";

    clueTimer.textContent =
      "♾️ No Time Limit";

    return;

  }

  const started =
    game.clue_turn_started_at;

  if(!started){

    clueTimer.className =
      "timer";

    clueTimer.textContent =
      timeLimit;

    return;

  }

  function update(){

    const elapsed =
      (
        Date.now() -
        new Date(started).getTime()
      ) / 1000;

    const remaining =
      Math.max(
        0,
        Math.ceil(
          timeLimit - elapsed
        )
      );

    clueTimer.textContent =
      remaining;

    clueTimer.className =
      remaining <= 10
      ? "timerWarning"
      : "timer";

    if(remaining <= 0){

      clearInterval(
        clueInterval
      );

      if(
        player.is_host &&
        game.status === "clues"
      ){

        advanceClue(
          true,
          true
        );

      }

    }

  }

  update();

  clueInterval =
    setInterval(
      update,
      250
    );

}


/* =========================================================
   ADVANCE CLUE
========================================================= */

async function advanceClue(
  skip=false,
  timeout=false
){

  if(!game || !player)
    return;

  if(game.status !== "clues")
    return;

  const expectedTurn =
    Number(
      game.clue_turn || 0
    );

  if(
    expectedTurn !== currentTurn
  )
    return;

  const current =
    clueOrder[currentTurn];

  if(!current)
    return;

  if(
    !skip &&
    current.id !== player.id
  )
    return;

  try{

    clueDoneButton.disabled =
      true;

    hostSkipButton.disabled =
      true;

    const result =
      await db.rpc(
        "advance_clue",
        {
          p_code:game.code,
          p_player_token:getToken(),
          p_expected_turn:expectedTurn,
          p_skip:skip
        }
      );

    if(result.error)
      throw result.error;

    await syncGame();

  }catch(error){

    console.error(
      "Advance clue:",
      error
    );

    await syncGame();

  }finally{

    clueDoneButton.disabled =
      false;

    hostSkipButton.disabled =
      false;

  }

}

async () => {

    return;

  submitVoteButton.disabled =

  voteStatus.textContent =

  try{

        {
          p_code:game.code,
          p_voter_token:getToken(),

      throw result.error;

    }else{

      voteStatus.textContent =
        "✓ Vote submitted. Waiting for everyone...";

    }

    /*
      DO NOT make the host manually
      finish voting anymore.

      Supabase cast_vote() changes
      the game to results automatically
      when everyone has voted.

      Force an immediate sync so the
      screen changes quickly.
    */

    await syncGame();

  }catch(error){

    console.error(
      "Vote error:",
      error
    );

    voteStatus.textContent =
      error.message ||
      "Could not submit vote.";

    submitVoteButton.disabled =

/* =========================================================
   RESULTS
========================================================= */

async function loadResults(){

  if(!game || !player)
    return;

  if(game.status !== "results")
    return;

  try{

    /*
      IMPORTANT:
      This is the PUBLIC result function.

      EVERY player can use it.
      The host is no longer required.
    */

    const result =
      await db.rpc(
        "get_public_vote_result",
        {
          p_code:game.code,
          p_player_token:getToken()
        }
      );

    if(result.error)
      throw result.error;

    const list =
      Array.isArray(result.data)
      ? result.data
      : [];

    show(resultsScreen);

    voteResults.innerHTML = "";

    /*
      Determine the highest vote count.
    */

    let highestVotes = 0;

    if(list.length){

      highestVotes =
        Math.max(
          ...list.map(
            p =>
              Number(
                p.votes || 0
              )
          )
        );

    }

    const leaders =
      list.filter(
        p =>
          Number(p.votes || 0) ===
          highestVotes
      );

    const isTie =
      highestVotes > 0 &&
      leaders.length > 1;

    /*
      SHOW EVERYONE THE RESULTS
    */

    if(!list.length){

      resultText.textContent =
        "No votes.";

    }

    else if(isTie){

      resultText.innerHTML =
        "⚖️ TIE VOTE";

    }

    else{

      const winner =
        leaders[0];

      resultText.textContent =
        winner.name +
        " received the most votes.";

    }


    /*
      Render vote totals for everyone.
    */

    list.forEach(
      p => {

        const div =
          document.createElement("div");

        div.className =
          "player";

        div.textContent =
          p.name +
          " — " +
          p.votes +
          (
            Number(p.votes) === 1
            ? " vote"
            : " votes"
          );

        voteResults.appendChild(
          div
        );

      }
    );


    /*
      The results screen now has ONLY
      the appropriate next action.
    */

    nextRoundButton.style.display =
      "none";

    backLobbyButton.style.display =
      "none";

    /*
      Remove old tie button if one exists.
    */

    const oldTieButton =
      document.getElementById(
        "tieClueButton"
      );

    if(oldTieButton)
      oldTieButton.remove();

    const oldWaiting =
      document.getElementById(
        "resultsWaiting"
      );

    if(oldWaiting)
      oldWaiting.remove();


    if(isTie){

      /*
        TIE:
        Host gets the button to return
        everyone to the clue round.

        Other players simply wait.
      */

      if(player.is_host){

        const tieButton =
          document.createElement("button");

        tieButton.id =
          "tieClueButton";

        tieButton.className =
          "secondary";

        tieButton.textContent =
          "↩ Back To Clue Round";

        tieButton.style.marginTop =
          "10px";

        tieButton.onclick =
          async () => {

            tieButton.disabled =
              true;

            try{

              const response =
                await db.rpc(
                  "tie_back_to_clues",
                  {
                    p_code:game.code,
                    p_host_token:getToken()
                  }
                );

              if(response.error)
                throw response.error;

              lastGameStatus =
                null;

              await syncGame();

            }catch(error){

              console.error(
                "Tie return:",
                error
              );

              alert(
                error.message ||
                "Could not return to clue round."
              );

              tieButton.disabled =
                false;

            }

          };

        resultsScreen.appendChild(
          tieButton
        );

      }else{

        const waiting =
          document.createElement("div");

        waiting.id =
          "resultsWaiting";

        waiting.className =
          "infoBox";

        waiting.textContent =
          "It's a tie. Waiting for the host to send everyone back to the clue round.";

        resultsScreen.appendChild(
          waiting
        );

      }

    }

    else{

      /*
        NO TIE:
        Only the host controls starting
        the next game.

        Everyone sees the same results.
      */

      if(player.is_host){

        nextRoundButton.style.display =
          "block";

        nextRoundButton.textContent =
          "Next Game";

      }else{

        const waiting =
          document.createElement("div");

        waiting.id =
          "resultsWaiting";

        waiting.className =
          "infoBox";

        waiting.textContent =
          "Waiting for the host to start the next game.";

        resultsScreen.appendChild(
          waiting
        );

      }

    }

  }catch(error){

    console.error(
      "Results error:",
      error
    );

    /*
      Don't trap the player forever.
    */

    setTimeout(
      () => {

        if(
          game &&
          game.status === "results"
        ){

          loadResults();

        }

      },
      700
    );

  }

}

  clearInterval(
    clueInterval
  );

  clearInterval(
    syncInterval
  );

  if(channel){

    try{

      await db.removeChannel(
        channel
      );

    }catch(e){}

    channel = null;

  }

  game = null;
  player = null;

  clueOrder = [];
  skippedPlayers.clear();

  currentTurn = 0;
  currentRound = 1;

  playerRole = null;
  playerWord = "";
  playerHint = "";

  lastGameStatus = null;

  clearSavedRoom();

  rejoinCard.classList.add(
    "hidden"
  );

  show(home);

  updateLeaveButton();

  setStatus(
    createStatus,
    "Ready to create a game.",
    "ok"
  );

  setConnection(
    true,
    "Multiplayer connected"
  );

}


/* =========================================================
   SAFARI VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  async () => {

    if(
      !document.hidden &&
      game
    ){

      await syncGame();

    }

  }
);


window.addEventListener(
  "pageshow",
  async () => {

    if(game){

      await syncGame();

    }

  }
);


/* =========================================================
   INPUT
========================================================= */

joinCode.addEventListener(
  "input",
  () => {

    joinCode.value =
      joinCode.value
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      )
      .slice(0,6);

  }
);


createName.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      createGame();

  }
);


joinName.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      joinGame();

  }
);


joinCode.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      joinGame();

  }
);


/* =========================================================
   EVENTS
========================================================= */

createButton.onclick =
createGame;

joinButton.onclick =
joinGame;


/* =========================================================
   INITIALIZE
========================================================= */

(async () => {

  try{

    initSupabase();

  }catch(error){

    console.error(error);

    setConnection(
      false,
      "Supabase unavailable"
    );

    setStatus(
      createStatus,
      "Supabase failed to load. Reload the page.",
      "err"
    );

    return;

  }

  await checkConnection();

  /*
    Only SHOW a rejoin option if there
    are actually at least two people
    still in the room.
  */

  await checkForPreviousGame();

})();
</script>
